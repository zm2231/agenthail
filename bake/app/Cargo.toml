[package]
name = "agenthail-rune"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
feed = { path = "../feed" }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
rune = { git = "https://github.com/zm2231/rune", rev = "098fe0d6252e1514b74c50d1302a80b70e12062d", features = ["tooling", "native-file-dialog"] }
rune-kit = { git = "https://github.com/zm2231/rune", rev = "098fe0d6252e1514b74c50d1302a80b70e12062d", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/zm2231/rune", rev = "098fe0d6252e1514b74c50d1302a80b70e12062d" }
rune-notify = { git = "https://github.com/zm2231/rune", rev = "098fe0d6252e1514b74c50d1302a80b70e12062d" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.58"

[patch.crates-io]
winit = { git = "https://github.com/zm2231/rune", rev = "098fe0d6252e1514b74c50d1302a80b70e12062d" }
sctk-adwaita = { git = "https://github.com/zm2231/rune", rev = "098fe0d6252e1514b74c50d1302a80b70e12062d" }
parley_engine = { git = "https://github.com/zm2231/rune", rev = "098fe0d6252e1514b74c50d1302a80b70e12062d" }
wgpu-hal = { git = "https://github.com/zm2231/rune", rev = "098fe0d6252e1514b74c50d1302a80b70e12062d" }
accesskit_windows = { git = "https://github.com/zm2231/rune", rev = "098fe0d6252e1514b74c50d1302a80b70e12062d" }
accesskit_macos = { git = "https://github.com/zm2231/rune", rev = "098fe0d6252e1514b74c50d1302a80b70e12062d" }

[profile.release]
debug = false
