[package]
name = "agenthail-rune"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
feed = { path = "../feed" }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
rune = { git = "https://github.com/zm2231/rune", rev = "99527ae68d598d11b4410c3ab0c72c8309f12950", features = ["tooling", "native-file-dialog"] }
rune-kit = { git = "https://github.com/zm2231/rune", rev = "99527ae68d598d11b4410c3ab0c72c8309f12950", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/zm2231/rune", rev = "99527ae68d598d11b4410c3ab0c72c8309f12950" }
rune-notify = { git = "https://github.com/zm2231/rune", rev = "99527ae68d598d11b4410c3ab0c72c8309f12950" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.58"

[patch.crates-io]
winit = { git = "https://github.com/zm2231/rune", rev = "99527ae68d598d11b4410c3ab0c72c8309f12950" }
sctk-adwaita = { git = "https://github.com/zm2231/rune", rev = "99527ae68d598d11b4410c3ab0c72c8309f12950" }
parley_engine = { git = "https://github.com/zm2231/rune", rev = "99527ae68d598d11b4410c3ab0c72c8309f12950" }
wgpu-hal = { git = "https://github.com/zm2231/rune", rev = "99527ae68d598d11b4410c3ab0c72c8309f12950" }
accesskit_windows = { git = "https://github.com/zm2231/rune", rev = "99527ae68d598d11b4410c3ab0c72c8309f12950" }
accesskit_macos = { git = "https://github.com/zm2231/rune", rev = "99527ae68d598d11b4410c3ab0c72c8309f12950" }

[profile.release]
debug = false
