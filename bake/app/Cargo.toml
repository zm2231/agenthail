[package]
name = "agenthail-rune"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
feed = { path = "../feed" }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = "0.3"
rune = { git = "https://github.com/zm2231/rune", rev = "df1550668ebf3b1fba2dc984e00402808d57c160", features = ["tooling", "native-file-dialog"] }
rune-kit = { git = "https://github.com/zm2231/rune", rev = "df1550668ebf3b1fba2dc984e00402808d57c160", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/zm2231/rune", rev = "df1550668ebf3b1fba2dc984e00402808d57c160" }
rune-notify = { git = "https://github.com/zm2231/rune", rev = "df1550668ebf3b1fba2dc984e00402808d57c160" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
wry = "0.58"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSRunningApplication", "libc"] }
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSData", "NSString", "NSBundle"] }

[features]
frame-profile = ["rune/frame-profile"]

[patch.crates-io]
winit = { git = "https://github.com/zm2231/rune", rev = "df1550668ebf3b1fba2dc984e00402808d57c160" }
sctk-adwaita = { git = "https://github.com/zm2231/rune", rev = "df1550668ebf3b1fba2dc984e00402808d57c160" }
parley_engine = { git = "https://github.com/zm2231/rune", rev = "df1550668ebf3b1fba2dc984e00402808d57c160" }
wgpu-hal = { git = "https://github.com/zm2231/rune", rev = "df1550668ebf3b1fba2dc984e00402808d57c160" }
accesskit_windows = { git = "https://github.com/zm2231/rune", rev = "df1550668ebf3b1fba2dc984e00402808d57c160" }
accesskit_macos = { git = "https://github.com/zm2231/rune", rev = "df1550668ebf3b1fba2dc984e00402808d57c160" }
sonora-aec3 = { git = "https://github.com/zm2231/rune", rev = "df1550668ebf3b1fba2dc984e00402808d57c160" }

[profile.release]
debug = false
