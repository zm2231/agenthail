[package]
name = "bake-gpui"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "bake-gpui"
path = "src/main.rs"

[dependencies]
feed = { path = "../feed" }
gpui = { package = "gpui-pre", version = "=0.3.9" }
gpui-component = "=0.8.0"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders"] }
anyhow = "1"
async-channel = "2"
