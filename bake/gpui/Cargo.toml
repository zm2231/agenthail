[package]
name = "bake-gpui"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[[bin]]
name = "bake-gpui"
path = "src/main.rs"

[dependencies]
feed = { path = "../feed" }
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
gpui-component = "=0.8.0"
gpui-base = "=0.8.0"
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.9", features = ["font-kit", "runtime_shaders", "test-support", "bench-support"] }
anyhow = "1"
async-channel = "2"
image = { version = "0.25.1", default-features = false, features = ["png"] }
serde_json = "1"
