[package]
name = "agenthail-views"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[[bin]]
name = "agenthail-views"
path = "src/main.rs"

[dependencies]
feed = { path = "../feed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["parsing", "formatting"] }
rune = { git = "https://github.com/zm2231/rune", rev = "d74939198aee33e645fb8dbd5a1d996da23afbc6", features = ["tooling"] }
rune-kit = { git = "https://github.com/zm2231/rune", rev = "d74939198aee33e645fb8dbd5a1d996da23afbc6", features = ["markdown"] }
rune-theme-opencode = { git = "https://github.com/zm2231/rune", rev = "d74939198aee33e645fb8dbd5a1d996da23afbc6" }

[patch.crates-io]
winit = { git = "https://github.com/zm2231/rune", rev = "d74939198aee33e645fb8dbd5a1d996da23afbc6" }
sctk-adwaita = { git = "https://github.com/zm2231/rune", rev = "d74939198aee33e645fb8dbd5a1d996da23afbc6" }
parley_engine = { git = "https://github.com/zm2231/rune", rev = "d74939198aee33e645fb8dbd5a1d996da23afbc6" }
wgpu-hal = { git = "https://github.com/zm2231/rune", rev = "d74939198aee33e645fb8dbd5a1d996da23afbc6" }
accesskit_windows = { git = "https://github.com/zm2231/rune", rev = "d74939198aee33e645fb8dbd5a1d996da23afbc6" }
accesskit_macos = { git = "https://github.com/zm2231/rune", rev = "d74939198aee33e645fb8dbd5a1d996da23afbc6" }

[profile.release]
debug = false
