name: iOS

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          STACK: ${{ toJSON(github.event.pull_request.stack) }}
          STACK_BASE_REF: ${{ github.event.pull_request.stack.base.ref }}
        run: |
          echo "stack: $STACK"
          if [ "$STACK" != null ]; then
            if [ -z "$STACK_BASE_REF" ]; then
              echo "ios=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git fetch --no-tags origin "+refs/heads/$STACK_BASE_REF:refs/remotes/origin/$STACK_BASE_REF"
            BASE="$(git merge-base "origin/$STACK_BASE_REF" HEAD)"
          fi
          yq '.targets[].sources[].path' native/project.yml > "$RUNNER_TEMP/sources"
          test -s "$RUNNER_TEMP/sources"
          git diff --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed"
          inputs=(native/project.yml native/Agenthail.xcodeproj scripts/ios-simulator.sh scripts/test-xcodegen-project.sh .github/workflows/ios.yml)
          while read -r source; do inputs+=("native/$source"); done < "$RUNNER_TEMP/sources"
          ios=false
          while read -r file; do
            for input in "${inputs[@]}"; do
              if [ "$file" = "$input" ] || [[ "$file" == "$input"/* ]]; then ios=true; fi
            done
          done < "$RUNNER_TEMP/changed"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && (!github.event.pull_request.stack || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","agenthail"]') }}
    timeout-minutes: 30
    env:
      DERIVED: ${{ github.workspace }}/../ios-derived
    steps:
      - uses: actions/checkout@v5
      - name: Boot simulator
        env:
          AGENTHAIL_SIMULATOR_NAME: ${{ runner.environment == 'self-hosted' && format('Agenthail CI {0}', runner.name) || '' }}
        run: |
          udid="$(scripts/ios-simulator.sh iphone)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
      - name: Wait for simulator boot
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Build for simulator tests
        run: xcodebuild build-for-testing -project native/Agenthail.xcodeproj -scheme AgenthailIOS -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath "$DERIVED"
      - name: iOS simulator tests
        run: |
          xcodebuild test-without-building -project native/Agenthail.xcodeproj -scheme AgenthailIOS -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath "$DERIVED" -parallel-testing-enabled NO
          plist="$DERIVED/Build/Products/Debug-iphonesimulator/Agenthail.app/Info.plist"
          test "$(plutil -extract NSCameraUsageDescription raw -o - "$plist")" = "Scan the pairing code shown by Agenthail on your computer, or take a photo to send to an agent."
          test "$(plutil -extract UIBackgroundModes.0 raw -o - "$plist")" = "remote-notification"
          test "$(plutil -extract UIBackgroundModes.1 raw -o - "$plist")" = "audio"
          test "$(plutil -extract UIBackgroundModes.2 raw -o - "$plist")" = "voip"
          app="$DERIVED/Build/Products/Debug-iphonesimulator/Agenthail.app"
          test -s "$app/Frameworks/WebRTC.framework/WebRTC"
          cmp native/iOS/WebRTC-LICENSE.txt "$app/WebRTC-LICENSE.txt"
      - name: Clean up self-hosted job
        if: always() && runner.environment == 'self-hosted'
        run: scripts/ci-self-hosted.sh cleanup

  ios-release:
    needs: changes
    if: needs.changes.outputs.ios == 'true' && (!github.event.pull_request.stack || github.event.pull_request.stack.position == github.event.pull_request.stack.size)
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.AGENTHAIL_IOS_BUNDLE_ID }}
      SIGNED: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify generated iOS project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          scripts/test-xcodegen-project.sh
      - name: iOS release device build
        if: env.SIGNED != 'true'
        run: xcodebuild build -project native/Agenthail.xcodeproj -scheme AgenthailIOS -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/derived" CODE_SIGNING_ALLOWED=NO
      - name: Import iOS signing assets
        if: env.SIGNED == 'true'
        env:
          SIGNING_IDENTITIES_P12: ${{ secrets.APPLE_IOS_SIGNING_IDENTITIES_P12_BASE64 }}
          SIGNING_IDENTITIES_P12_PASSWORD: ${{ secrets.APPLE_IOS_SIGNING_IDENTITIES_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 }}
          NOTIFICATION_SERVICE_PROVISIONING_PROFILE: ${{ secrets.APPLE_IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: scripts/ios-sign.sh import
      - name: Archive and export the signed app without uploading
        if: env.SIGNED == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          scripts/ios-sign.sh archive "$RUNNER_TEMP/Agenthail.xcarchive" 0.0.0 "$GITHUB_RUN_NUMBER"
          scripts/ios-sign.sh export "$RUNNER_TEMP/Agenthail.xcarchive" "$RUNNER_TEMP/export"
          scripts/ios-sign.sh verify "$RUNNER_TEMP/export/Agenthail.ipa"
