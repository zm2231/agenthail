name: iOS

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ios: ${{ steps.diff.outputs.ios }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          yq '.targets[].sources[].path' native/project.yml > "$RUNNER_TEMP/sources"
          test -s "$RUNNER_TEMP/sources"
          git diff --name-only --no-renames "$BASE" HEAD > "$RUNNER_TEMP/changed"
          inputs=(native/project.yml native/Agenthail.xcodeproj scripts/ios-simulator.sh scripts/test-xcodegen-project.sh .github/workflows/ios.yml)
          while read -r source; do inputs+=("native/$source"); done < "$RUNNER_TEMP/sources"
          ios=false
          while read -r file; do
            for input in "${inputs[@]}"; do
              if [ "$file" = "$input" ] || [[ "$file" == "$input"/* ]]; then ios=true; fi
            done
          done < "$RUNNER_TEMP/changed"
          echo "ios=$ios" >> "$GITHUB_OUTPUT"

  ios:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","agenthail"]') }}
    timeout-minutes: 30
    env:
      DERIVED: ${{ github.workspace }}/../ios-derived
    steps:
      - uses: actions/checkout@v5
      - name: Boot simulator
        env:
          AGENTHAIL_SIMULATOR_NAME: ${{ runner.environment == 'self-hosted' && format('Agenthail CI {0}', runner.name) || '' }}
        run: |
          udid="$(scripts/ios-simulator.sh iphone)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
      - name: Wait for simulator boot
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Build for simulator tests
        run: xcodebuild build-for-testing -project native/Agenthail.xcodeproj -scheme AgenthailIOS -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath "$DERIVED"
      - name: iOS simulator tests
        run: |
          xcodebuild test-without-building -project native/Agenthail.xcodeproj -scheme AgenthailIOS -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath "$DERIVED" -parallel-testing-enabled NO
          plist="$DERIVED/Build/Products/Debug-iphonesimulator/Agenthail.app/Info.plist"
          test "$(plutil -extract NSCameraUsageDescription raw -o - "$plist")" = "Scan the pairing code shown by Agenthail on your Mac, or take a photo to send to an agent."
          test "$(plutil -extract UIBackgroundModes.0 raw -o - "$plist")" = "remote-notification"
      - name: Clean up self-hosted job
        if: always() && runner.environment == 'self-hosted'
        run: scripts/ci-self-hosted.sh cleanup

  ios-release:
    needs: changes
    if: needs.changes.outputs.ios == 'true'
    runs-on: ${{ github.event.pull_request.head.repo.full_name != github.repository && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","agenthail"]') }}
    timeout-minutes: 20
    env:
      DERIVED: ${{ github.workspace }}/../ios-release-derived
    steps:
      - uses: actions/checkout@v5
      - name: Verify generated iOS project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          scripts/test-xcodegen-project.sh
      - name: iOS release device build
        run: xcodebuild build -project native/Agenthail.xcodeproj -scheme AgenthailIOS -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$DERIVED" CODE_SIGNING_ALLOWED=NO
      - name: Clean up self-hosted job
        if: always() && runner.environment == 'self-hosted'
        run: scripts/ci-self-hosted.sh cleanup
