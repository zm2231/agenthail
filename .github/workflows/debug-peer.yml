name: debug-peer
on:
  push:
    branches: [fix/peer-macos26]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Env
        run: |
          sw_vers; sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string; go version; go env GOCACHE
          echo "TMPDIR=$TMPDIR XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-} CLAUDE_CONFIG_DIR=${CLAUDE_CONFIG_DIR:-}"
      - name: Full suite as release, no prewarm
        run: go test ./... -race -count=1 -v 2>&1 | grep -E 'DEBUG|^--- FAIL|^FAIL|after |^ok .*peerbridge|manager_test' | tail -80
