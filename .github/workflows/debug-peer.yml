name: debug-peer
on:
  push:
    branches: [fix/peer-macos26]
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Env
        run: |
          sw_vers; sysctl -n hw.ncpu hw.memsize machdep.cpu.brand_string; go version; go env GOCACHE
          echo "TMPDIR=$TMPDIR XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR:-} CLAUDE_CONFIG_DIR=${CLAUDE_CONFIG_DIR:-}"
      - name: Cold-ish build timing of cmd/agenthail
        run: time go build -o "$RUNNER_TEMP/ah" ./cmd/agenthail
      - name: peerbridge alone
        run: go test -race -count=1 -v -run TestManagerOwnsOnePeerPerSessionAndHealsLostWorkers ./internal/peerbridge 2>&1 | tail -30
      - name: Full suite as release
        run: go test ./... -race -count=1 2>&1 | grep -vE '^ok ' | tail -80
