name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Release version such as v0.2.0
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          published="$(gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [ "$EVENT" = "push" ] && [ "$published" = "false" ]; then
            echo "$TAG is already published; run this workflow manually to rebuild it."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  push-relay-check:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-relay/package-lock.json
      - name: Validate APNs provider credentials
        env:
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_TOPIC: ${{ vars.AGENTHAIL_IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          : "${APNS_TOPIC:?missing AGENTHAIL_IOS_BUNDLE_ID repository variable}"
          node push-relay/scripts/verify-apns-credentials.mjs
      - name: Install locked relay dependencies
        working-directory: push-relay
        run: npm ci --ignore-scripts
      - name: Test relay
        working-directory: push-relay
        run: npm test

  macos-test:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - name: Cookie bridge dependencies
        working-directory: sidecar
        run: npm ci --ignore-scripts
      - name: Claude host tests
        run: |
          npm ci --prefix claude-host --omit=optional --ignore-scripts --no-audit --no-fund
          npm test --prefix claude-host
      - name: Stage the shipped Node
        run: scripts/fetch-node.sh
      - name: Test source
        run: |
          go test ./... -race -count=1 -timeout 25m
          go vet ./...

  macos-package:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-host/package-lock.json
      - name: Import Developer ID certificates
        env:
          APPLICATION_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          INSTALLER_P12: ${{ secrets.APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          : "${APPLICATION_P12:?missing APPLE_DEVELOPER_ID_APPLICATION_P12_BASE64}"
          : "${INSTALLER_P12:?missing APPLE_DEVELOPER_ID_INSTALLER_P12_BASE64}"
          : "${P12_PASSWORD:?missing APPLE_DEVELOPER_ID_P12_PASSWORD}"
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/agenthail-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          printf '%s' "$APPLICATION_P12" | base64 --decode > "$RUNNER_TEMP/Application.p12"
          printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/Installer.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/Application.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security import "$RUNNER_TEMP/Installer.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v "$KEYCHAIN_PATH"
      - name: Configure notarization
        env:
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          : "${NOTARY_KEY:?missing APPLE_NOTARY_KEY_BASE64}"
          printf '%s' "$NOTARY_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool store-credentials agenthail-ci --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID"
      - name: Build package
        timeout-minutes: 30
        env:
          AGENTHAIL_NOTARY_PROFILE: agenthail-ci
          AGENTHAIL_INSTALLER_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AGENTHAIL_PUSH_RELAY_URL: ${{ vars.AGENTHAIL_PUSH_RELAY_URL }}
          AGENTHAIL_UPDATE_RELEASE_URL: https://api.github.com/repos/${{ github.repository }}/releases/latest
          AGENTHAIL_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          : "${AGENTHAIL_PUSH_RELAY_URL:?missing AGENTHAIL_PUSH_RELAY_URL repository variable}"
          scripts/build-pkg.sh
      - name: Verify package artifact
        run: scripts/test-pkg-artifact.sh dist/Agenthail-*.pkg
      - name: Verify clean install, upgrade, and uninstall
        run: scripts/test-pkg-install.sh dist/Agenthail-*.pkg
      - name: Build release archive
        timeout-minutes: 30
        env:
          AGENTHAIL_NOTARY_PROFILE: agenthail-ci
          AGENTHAIL_PUSH_RELAY_URL: ${{ vars.AGENTHAIL_PUSH_RELAY_URL }}
          AGENTHAIL_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          : "${AGENTHAIL_PUSH_RELAY_URL:?missing AGENTHAIL_PUSH_RELAY_URL repository variable}"
          scripts/package-release.sh
      - uses: actions/upload-artifact@v7
        with:
          name: agenthail-macos-release
          path: |
            dist/Agenthail-*.pkg
            dist/Agenthail-*.pkg.sha256
            dist/agenthail-*.tar.gz
            dist/agenthail-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  linux-archive:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: claude-host/package-lock.json
      - name: Claude host tests
        if: matrix.arch == 'amd64'
        run: |
          npm ci --prefix claude-host --omit=optional --ignore-scripts --no-audit --no-fund
          npm test --prefix claude-host
      - name: Stage the shipped Node
        if: matrix.arch == 'amd64'
        run: scripts/fetch-node.sh
      - name: Test source on Linux
        if: matrix.arch == 'amd64'
        run: |
          go test ./... -race -count=1 -timeout 25m
          go vet ./...
      - name: Build Linux archive
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          AGENTHAIL_PUSH_RELAY_URL: ${{ vars.AGENTHAIL_PUSH_RELAY_URL }}
          AGENTHAIL_UPDATE_RELEASE_URL: https://api.github.com/repos/${{ github.repository }}/releases/latest
          AGENTHAIL_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          : "${AGENTHAIL_PUSH_RELAY_URL:?missing AGENTHAIL_PUSH_RELAY_URL repository variable}"
          scripts/package-release.sh
      - name: Verify Linux archive
        env:
          ARCH: ${{ matrix.arch }}
          AGENTHAIL_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          name="agenthail-${AGENTHAIL_VERSION}-linux-${ARCH}"
          (cd dist && sha256sum -c "$name.tar.gz.sha256")
          mkdir -p "$RUNNER_TEMP/inspect"
          if tar -tvzf "dist/$name.tar.gz" | grep -v '^[d-]'; then
            echo "error: agenthail update extracts only directories and regular files" >&2
            exit 1
          fi
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP/inspect"
          test -x "$RUNNER_TEMP/inspect/$name/agenthail"
          test -f "$RUNNER_TEMP/inspect/$name/skills/agenthail-operations/SKILL.md"
          test -f "$RUNNER_TEMP/inspect/$name/claude-host/node_modules/@anthropic-ai/claude-agent-sdk/package.json"
          test -x "$RUNNER_TEMP/inspect/$name/runtime/node/bin/node"
          file "$RUNNER_TEMP/inspect/$name/agenthail" | grep -q "ELF 64-bit"
          if [ "$ARCH" = "amd64" ]; then
            "$RUNNER_TEMP/inspect/$name/agenthail" version --json | jq -e --arg version "$AGENTHAIL_VERSION" '.version == $version'
            test "$("$RUNNER_TEMP/inspect/$name/runtime/node/bin/node" --version)" = v22.23.1
            (cd "$RUNNER_TEMP/inspect/$name/claude-host" && "$RUNNER_TEMP/inspect/$name/runtime/node/bin/node" -e "import('@anthropic-ai/claude-agent-sdk').then(module => { if (!module.query) process.exit(1) })")
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: agenthail-linux-${{ matrix.arch }}
          path: |
            dist/agenthail-*-linux-*.tar.gz
            dist/agenthail-*-linux-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  ios-archive:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      IOS_BUNDLE_ID: ${{ vars.AGENTHAIL_IOS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate --spec native/project.yml
      - name: Verify iOS release simulator build
        run: xcodebuild -project native/Agenthail.xcodeproj -scheme AgenthailIOS -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Import iOS signing assets
        env:
          SIGNING_IDENTITIES_P12: ${{ secrets.APPLE_IOS_SIGNING_IDENTITIES_P12_BASE64 }}
          SIGNING_IDENTITIES_P12_PASSWORD: ${{ secrets.APPLE_IOS_SIGNING_IDENTITIES_P12_PASSWORD }}
          PROVISIONING_PROFILE: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 }}
          NOTIFICATION_SERVICE_PROVISIONING_PROFILE: ${{ secrets.APPLE_IOS_NOTIFICATION_SERVICE_PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: scripts/ios-sign.sh import
      - name: Archive iOS app
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: scripts/ios-sign.sh archive "$RUNNER_TEMP/Agenthail.xcarchive" "${RELEASE_VERSION#v}" "$GITHUB_RUN_NUMBER"
      - name: Export App Store IPA
        run: scripts/ios-sign.sh export "$RUNNER_TEMP/Agenthail.xcarchive" "$RUNNER_TEMP/export"
      - name: Verify iOS release metadata
        run: |
          plist="$RUNNER_TEMP/Agenthail.xcarchive/Products/Applications/Agenthail.app/Info.plist"
          test "$(plutil -extract ITSAppUsesNonExemptEncryption raw -o - "$plist")" = "false"
          test "$(plutil -extract NSCameraUsageDescription raw -o - "$plist")" = "Scan the pairing code shown by Agenthail on your computer, or take a photo to send to an agent."
          test "$(plutil -extract UIBackgroundModes.0 raw -o - "$plist")" = "remote-notification"
          test "$(plutil -extract UIBackgroundModes.1 raw -o - "$plist")" = "audio"
          test "$(plutil -extract UIBackgroundModes.2 raw -o - "$plist")" = "voip"
          scripts/ios-sign.sh verify "$RUNNER_TEMP/export/Agenthail.ipa"
          app="$RUNNER_TEMP/ipa-inspect/Payload/Agenthail.app"
          test -s "$app/Frameworks/WebRTC.framework/WebRTC"
          cmp native/iOS/WebRTC-LICENSE.txt "$app/WebRTC-LICENSE.txt"
      - name: Validate IPA
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          for attempt in 1 2 3; do
            set +e
            output="$(xcrun altool --validate-app -f "$RUNNER_TEMP/export/Agenthail.ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)"
            result=$?
            set -e
            printf 'IPA validation attempt %s of 3\n%s\n' "$attempt" "$output"
            if [[ "$result" -eq 0 ]] && ! grep -q 'ERROR:' <<<"$output"; then
              exit 0
            fi
            validation_code="$(sed -nE 's/.*Validation failed \(([0-9]{3})\).*/\1/p' <<<"$output" | head -n 1)"
            if [[ "$validation_code" =~ ^4[0-9]{2}$ ]] && [[ "$validation_code" != "429" ]]; then
              exit 1
            fi
            if [[ -z "$validation_code" ]] && grep -q 'STATE_ERROR\.VALIDATION_ERROR' <<<"$output"; then
              exit 1
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 10))
            fi
          done
          exit 1
      - name: Package iOS dSYMs
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          archive="$RUNNER_TEMP/Agenthail.xcarchive"
          app_uuids="$(xcrun dwarfdump --uuid "$archive/Products/Applications/Agenthail.app/Agenthail" | awk '{print $2}' | sort)"
          dsym_uuids="$(xcrun dwarfdump --uuid "$archive/dSYMs/Agenthail.app.dSYM" | awk '{print $2}' | sort)"
          printf 'App UUIDs:\n%s\n' "$app_uuids"
          test -n "$app_uuids"
          test "$app_uuids" = "$dsym_uuids"
          mkdir -p "$RUNNER_TEMP/dsyms"
          ditto -c -k --keepParent "$archive/dSYMs" "$RUNNER_TEMP/dsyms/Agenthail-iOS-${RELEASE_VERSION#v}-dSYMs.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: agenthail-ios-release
          path: ${{ runner.temp }}/export/Agenthail.ipa
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: agenthail-ios-dsyms
          path: ${{ runner.temp }}/dsyms/*.zip
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: [push-relay-check, macos-test, macos-package, linux-archive, ios-archive]
    runs-on: macos-15
    timeout-minutes: 55
    env:
      AGENTHAIL_PUSH_RELAY_URL: ${{ vars.AGENTHAIL_PUSH_RELAY_URL }}
      IOS_BUNDLE_ID: ${{ vars.AGENTHAIL_IOS_BUNDLE_ID }}
      RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: agenthail-macos-release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: agenthail-linux-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: agenthail-ios-release
          path: ios
      - uses: actions/download-artifact@v4
        with:
          name: agenthail-ios-dsyms
          path: dsyms
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-relay/package-lock.json
      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          draft: true
          files: |
            dist/Agenthail-*.pkg
            dist/Agenthail-*.pkg.sha256
            dist/agenthail-*.tar.gz
            dist/agenthail-*.tar.gz.sha256
            dsyms/Agenthail-iOS-*-dSYMs.zip
      - name: Configure App Store Connect authentication
        env:
          ASC_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
        run: |
          : "${ASC_KEY:?missing APPLE_NOTARY_KEY_BASE64}"
          : "${ASC_KEY_ID:?missing APPLE_NOTARY_KEY_ID}"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          chmod 600 "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
      - name: Upload validated IPA to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          output="$(xcrun altool --upload-app -f ios/Agenthail.ipa -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1)"
          printf '%s\n' "$output"
          if grep -q 'ERROR:' <<<"$output"; then exit 1; fi
      - name: Verify internal TestFlight delivery
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          ASC_GROUP_ID: ${{ vars.AGENTHAIL_TESTFLIGHT_GROUP_ID }}
          ASC_BUILD_NUMBER: ${{ github.run_number }}
          ASC_MARKETING_VERSION: ${{ github.event.inputs.version || github.ref_name }}
          ASC_BUNDLE_ID: ${{ vars.AGENTHAIL_IOS_BUNDLE_ID }}
        run: node push-relay/scripts/wait-testflight-build.mjs
      - name: Deploy validated relay
        working-directory: push-relay
        env:
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_KEY_P8: ${{ secrets.APNS_KEY_P8 }}
          APNS_TOPIC: ${{ vars.AGENTHAIL_IOS_BUNDLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PUSH_DEVICES_KV_ID: ${{ secrets.CLOUDFLARE_PUSH_DEVICES_KV_ID }}
        run: |
          : "${APNS_KEY_ID:?missing APNS_KEY_ID}"
          : "${APNS_KEY_P8:?missing APNS_KEY_P8}"
          : "${APNS_TOPIC:?missing AGENTHAIL_IOS_BUNDLE_ID repository variable}"
          : "${APPLE_TEAM_ID:?missing APPLE_TEAM_ID}"
          : "${CLOUDFLARE_ACCOUNT_ID:?missing CLOUDFLARE_ACCOUNT_ID}"
          : "${CLOUDFLARE_API_TOKEN:?missing CLOUDFLARE_API_TOKEN}"
          npm ci --ignore-scripts
          if [ -z "$CLOUDFLARE_PUSH_DEVICES_KV_ID" ]; then
            CLOUDFLARE_PUSH_DEVICES_KV_ID="$(node scripts/ensure-kv-namespace.mjs)"
          fi
          export CLOUDFLARE_PUSH_DEVICES_KV_ID
          node scripts/render-wrangler-config.mjs wrangler.toml wrangler.production.toml
          jq -n --arg key "$APNS_KEY_P8" --arg id "$APNS_KEY_ID" --arg team "$APPLE_TEAM_ID" --arg topic "$APNS_TOPIC" '{APNS_KEY_P8:$key,APNS_KEY_ID:$id,APPLE_TEAM_ID:$team,APNS_TOPIC:$topic}' | ./node_modules/.bin/wrangler secret bulk --config wrangler.production.toml
          ./node_modules/.bin/wrangler deploy --config wrangler.production.toml --var "RELAY_VERSION:${RELEASE_VERSION}"
      - name: Verify relay compatibility
        run: |
          : "${AGENTHAIL_PUSH_RELAY_URL:?missing AGENTHAIL_PUSH_RELAY_URL repository variable}"
          for attempt in {1..12}; do
            health="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 2 "${AGENTHAIL_PUSH_RELAY_URL}/health?release=${RELEASE_VERSION}&attempt=${attempt}")"
            if jq -e --arg version "$RELEASE_VERSION" '.ok == true and .protocol == 2 and .version == $version and .appAttest.required == true and .appAttest.configured == true and .apns.configured == true and .rateLimits.configured == true and (.capabilities | index("app-attest")) and (.capabilities | index("registration-check"))' <<<"$health"; then
              exit 0
            fi
            printf 'Relay compatibility attempt %s of 12 did not observe %s: %s\n' "$attempt" "$RELEASE_VERSION" "$health"
            sleep 5
          done
          exit 1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_VERSION" --draft=false --latest

  homebrew:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: agenthail-macos-release
          path: dist
      - uses: actions/create-github-app-token@v2
        id: tap
        with:
          app-id: ${{ secrets.AGENTHAIL_TAP_APP_ID }}
          private-key: ${{ secrets.AGENTHAIL_TAP_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
      - name: Update the Homebrew formula
        env:
          TAP_TOKEN: ${{ steps.tap.outputs.token }}
          TAP: ${{ github.repository_owner }}/homebrew-tap
        run: |
          archive="dist/agenthail-${RELEASE_VERSION}-darwin-arm64.tar.gz"
          sha="$(sha256sum "$archive" | cut -d' ' -f1)"
          tap="$RUNNER_TEMP/homebrew-tap"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP}.git" "$tap"
          sed -e "s/@TAG@/${RELEASE_VERSION}/g" -e "s/@SHA256@/${sha}/" -e "s/@REVISION@/${GITHUB_SHA}/" packaging/homebrew/agenthail.rb > "$tap/Formula/agenthail.rb"
          if grep -q '@[A-Z0-9]*@' "$tap/Formula/agenthail.rb"; then
            echo "error: the formula template left a placeholder unfilled" >&2
            exit 1
          fi
          cd "$tap"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/agenthail.rb
          if ! git diff --cached --quiet; then
            git commit -m "agenthail ${RELEASE_VERSION#v}"
            git push origin HEAD
          fi
