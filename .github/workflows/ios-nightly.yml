name: iOS nightly

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-nightly
  cancel-in-progress: false

jobs:
  iphone:
    uses: ./.github/workflows/ios-device-tests.yml
    permissions:
      contents: read
      issues: write
    with:
      device: iphone
      issue: Nightly iOS tests are failing
      run-name: nightly iOS test run

  ipad:
    uses: ./.github/workflows/ios-device-tests.yml
    permissions:
      contents: read
      issues: write
    with:
      device: ipad
      issue: Nightly iPad tests are failing
      run-name: nightly iPad test run
