name: iOS nightly

on:
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-nightly
  cancel-in-progress: false

jobs:
  ios:
    if: github.repository == 'zm2231/agenthail'
    runs-on: [self-hosted, macOS, ARM64, agenthail]
    timeout-minutes: 90
    env:
      DERIVED: ${{ github.workspace }}/../ios-derived
    outputs:
      artifact: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@v5
      - name: Check crash reporter dialogs are off
        run: |
          if [ "$(defaults read com.apple.CrashReporter DialogType 2>/dev/null)" != none ]; then
            echo "::error::Crash reporter dialogs are not turned off for this runner's user, so every UI test teardown can wait about 300 s on one. Run 'defaults write com.apple.CrashReporter DialogType none' as that user. See Crash reporter dialogs in docs/maintainers/self-hosted-ci.md."
            exit 1
          fi
      - name: Every UI test is in one tier
        run: scripts/ios-ui-tests.sh check
      - name: Boot simulator
        env:
          AGENTHAIL_SIMULATOR_NAME: Agenthail CI ${{ runner.name }}
        run: |
          udid="$(scripts/ios-simulator.sh iphone)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
      - name: Wait for simulator boot
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b
      - name: Build for simulator tests
        run: xcodebuild build-for-testing -project native/Agenthail.xcodeproj -scheme AgenthailIOS -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath "$DERIVED"
      - name: Every iOS test tier
        run: |
          rm -rf "$RUNNER_TEMP/ios-tests.xcresult"
          only=()
          while IFS= read -r arg; do only+=("$arg"); done < <(scripts/ios-ui-tests.sh args smoke main nightly)
          scripts/ios-test-stall-guard.sh xcodebuild test-without-building -project native/Agenthail.xcodeproj -scheme AgenthailIOS -configuration Debug -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" -derivedDataPath "$DERIVED" "${only[@]}" -parallel-testing-enabled NO -collect-test-diagnostics never -resultBundlePath "$RUNNER_TEMP/ios-tests.xcresult"
      - name: Upload test results
        id: upload
        if: always() && job.status != 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ios-nightly-xcresult-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-tests.xcresult
          retention-days: 14
          if-no-files-found: ignore
      - name: Clean up self-hosted job
        if: always()
        run: scripts/ci-self-hosted.sh cleanup

  report:
    needs: ios
    if: always() && needs.ios.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Open, update or close the nightly issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACT_URL: ${{ needs.ios.outputs.artifact }}
          ISSUE_ASSIGNEE: ${{ github.repository_owner }}
          RESULT: ${{ needs.ios.result }}
        run: scripts/ci-failure-issue.sh "$RESULT" "Nightly iOS tests are failing" "nightly iOS test run"
