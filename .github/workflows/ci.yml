name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

# A pull request's newer push replaces its run. Each push to main gets a group
# of its own, so no later merge cancels or replaces it, and a release can use
# the result at the commit it tags.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  gate:
    if: ${{ (!github.event.pull_request.stack || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.full.outputs.full }}
    steps:
      - uses: actions/checkout@v5
      - id: full
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: scripts/ci-full-gate.sh

  verify:
    needs: gate
    if: ${{ !cancelled() && (!github.event.pull_request.stack || github.event.pull_request.stack.position == github.event.pull_request.stack.size) }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-26' || fromJSON('["self-hosted","macOS","ARM64","agenthail"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Isolate self-hosted job
        if: runner.environment == 'self-hosted'
        run: scripts/ci-self-hosted.sh prepare >> "$GITHUB_ENV"
      - name: Sample host load
        if: runner.environment == 'self-hosted'
        run: scripts/ci-host-load.sh start
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: ${{ runner.environment != 'self-hosted' }}
      - name: Trim self-hosted Go cache
        if: runner.environment == 'self-hosted'
        run: scripts/ci-self-hosted.sh trim-go-cache
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: ${{ runner.environment != 'self-hosted' && 'npm' || '' }}
          cache-dependency-path: |
            push-relay/package-lock.json
            claude-host/package-lock.json
            browser-host/package-lock.json
            sidecar/package-lock.json
      - uses: actions/cache@v5
        if: runner.environment != 'self-hosted'
        with:
          path: ~/.cache/agenthail-build/playwright
          key: agenthail-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-host/package-lock.json') }}
      - name: Node host modules
        # verify-linux-daemon runs the Node host tests; --omit=optional leaves out the platform builds, so macOS adds nothing to them.
        run: |
          npm ci --prefix claude-host --omit=optional --ignore-scripts --no-audit --no-fund
          npm ci --prefix browser-host --omit=optional --ignore-scripts --no-audit --no-fund
          npm ci --prefix scripts/dashboard-guard --ignore-scripts --no-audit --no-fund
      - name: Cookie bridge dependencies
        working-directory: sidecar
        run: npm ci --ignore-scripts
      - name: Stage the shipped Node
        run: scripts/fetch-node.sh
      - name: Tests of the packages with macOS code paths, the readability guard and native helpers
        # Linux runs every package with -race. A gate that did not decide runs the native helper tests.
        env:
          FULL: ${{ needs.gate.outputs.full == 'true' || needs.gate.result != 'success' }}
          GUARD_CACHE: ${{ runner.tool_cache }}/agenthail-cache/chrome-for-testing
        run: AGENTHAIL_BROWSER_TEST_BROWSERS="${AGENTHAIL_BUILD_CACHE:-$HOME/.cache/agenthail-build}/playwright" scripts/ci-darwin-tests.sh
      - name: Session process identity tests
        # The macOS kernel's peer credentials, parent pid and open files, named so a run shows each one passing.
        shell: bash
        run: |
          go test ./internal/peerproc/ -run '^(TestTheKernelNamesTheProcessOnTheOtherEndAndItsParent|TestTheKernelListsTheFilesAnotherProcessHoldsOpen)$' -count=1 -v | tee "$RUNNER_TEMP/peer.log"
          go test ./internal/daemon/ -run '^(TestASessionsOwnStdioServerActsAsTheSessionItsProcessHoldsNow|TestAProcessThatIsNoSessionGetsNoTools|TestASessionStartedWhileTheDaemonIsDownGetsItsToolsWhenItComesUp|TestACodexToolCallActsAsTheThreadItNamesOnlyWhileItsCodexProcessHoldsIt|TestACodexChildCannotOversizeOrBatchItsRequests)$' -count=1 -v | tee -a "$RUNNER_TEMP/peer.log"
          test "$(grep -c -- '^--- PASS: ' "$RUNNER_TEMP/peer.log")" -eq 7
      - name: Real Codex app-server tests
        # The tests above skip these when codex is not installed; here each must pass.
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/codex" --no-audit --no-fund @openai/codex@0.163.0
          PATH="$RUNNER_TEMP/codex/node_modules/.bin:$PATH" go test ./internal/surface/surfaces/ -run '^(TestACodexCompactionHoldsReloadsOnlyUntilItsTurnEnds|TestATurnStartedBeforeTheCodexAppServerRestartedIsNotRunning|TestARealCodexThreadMovesBetweenTwoAdaptersInOneProcessAndBack|TestInstallingTheCodexRelayWritesOnlyItsTablesAndUninstallRestoresTheBytes|TestTheCodexRelayInstallLeavesAServerItDidNotWrite|TestAnInstallBuiltOnAConfigCodexHasSinceRewrittenIsBuiltAgain|TestAThreadAgenthailStartsHasOnlyItsOwnServerWhileThePersonsThreadsGetTheRelay)$' -count=1 -v | tee "$RUNNER_TEMP/codex-real.log"
          PATH="$RUNNER_TEMP/codex/node_modules/.bin:$PATH" go test ./internal/daemon/ -run '^(TestAnIdleCodexThreadMovesToAPairedHostAndRunsThere|TestARealCodexThreadCallsTheToolsAsItselfThroughTheStdioRelay)$' -count=1 -v | tee -a "$RUNNER_TEMP/codex-real.log"
          PATH="$RUNNER_TEMP/codex/node_modules/.bin:$PATH" go test ./internal/cli/ -run '^TestCodexMCPOffTakesTheRelayOutOfCodexsConfigOnInstallAndSaysSo$' -count=1 -v | tee -a "$RUNNER_TEMP/codex-real.log"
          test "$(grep -c -- '^--- PASS: ' "$RUNNER_TEMP/codex-real.log")" -eq 10
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Session journal browser tests
        run: |
          node scripts/test-session-journal.mjs
          node scripts/test-dashboard-load.mjs
          node scripts/test-dashboard-startup.mjs
          node scripts/test-dashboard-idempotency.mjs
          node scripts/test-dashboard-pending-send.mjs
          node scripts/test-dashboard-compact-holds.mjs
          node scripts/test-dashboard-composer-send.mjs
          node scripts/test-dashboard-queued-attachments.mjs
          node scripts/test-dashboard-timeline.mjs
          node scripts/test-dashboard-waiting.mjs
          node scripts/test-dashboard-lead-replacements.mjs
          node scripts/test-dashboard-lead-replacement-clicks.mjs
          node scripts/test-dashboard-decisions.mjs
          node scripts/test-dashboard-question-pager.mjs
          node scripts/test-dashboard-activity.mjs
          node scripts/test-dashboard-plan.mjs
          node scripts/test-dashboard-ui.mjs
          node scripts/test-dashboard-usage.mjs
          node scripts/test-dashboard-usage-proxy.mjs
          node scripts/test-dashboard-usage-prefer.mjs
          node scripts/test-dashboard-tool-activity.mjs
          node scripts/test-dashboard-agent-messages.mjs
          node scripts/test-dashboard-relays.mjs
          node scripts/test-dashboard-audit.mjs
          node scripts/test-dashboard-rekeys.mjs
          node scripts/test-dashboard-signin.mjs
          node scripts/test-dashboard-projects.mjs
          node scripts/test-dashboard-project-view.mjs
          node scripts/test-dashboard-session-order.mjs
          node scripts/test-dashboard-shared-stream.mjs
          node scripts/test-dashboard-live-order.mjs
          node scripts/test-dashboard-project-now.mjs
          node scripts/test-dashboard-project-tiles.mjs
          node scripts/test-dashboard-decision-card.mjs
          node scripts/test-dashboard-push-worker.mjs
          node scripts/test-dashboard-session-scope.mjs
          node scripts/test-dashboard-holders.mjs
          node scripts/test-dashboard-model.mjs
          node scripts/test-dashboard-turn-settings.mjs
          node scripts/test-dashboard-config-roots.mjs
          node scripts/test-dashboard-devices.mjs
          node scripts/test-session-controls.mjs
      - name: Public copy check
        run: |
          scripts/test-check-public-copy.sh
          scripts/check-public-copy.sh
      - name: Runner hook tests
        run: |
          scripts/test-ci-runner-job-started.sh
          scripts/test-ci-concurrently.sh
          scripts/test-ci-full-label.sh
          scripts/test-ci-failure-issue.sh
          scripts/test-ios-ui-tests.sh
          scripts/ios-ui-tests.sh check
      - name: Push relay tests
        working-directory: push-relay
        run: |
          npm ci --ignore-scripts
          npm test
          npm run deploy:dry-run
      - name: Verify configurable release build
        run: |
          binary="$RUNNER_TEMP/agenthail-relay-config"
          relay="https://push.example.test"
          release_api="https://api.github.com/repos/example/agenthail/releases/latest"
          team="AAAAAAAAAA"
          go build -trimpath -ldflags "-X github.com/zm2231/agenthail/internal/daemon.bundledPushRelayURL=$relay -X github.com/zm2231/agenthail/internal/cli.latestReleaseURL=$release_api -X github.com/zm2231/agenthail/internal/cli.expectedInstallerTeamID=$team" -o "$binary" ./cmd/agenthail
          strings "$binary" | grep -F "$relay" >/dev/null
          strings "$binary" | grep -F "$release_api" >/dev/null
          strings "$binary" | grep -F "$team" >/dev/null
      - name: Installer lint
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
          scripts/test-codesign-retry.sh
          scripts/test-notarize-pkg.sh
          scripts/test-ci-self-hosted.sh
          scripts/test-ci-host-load.sh
          scripts/test-ci-needs-passed.sh
          scripts/test-ios-test-stall-guard.sh
          scripts/test-ios-simulator-clones.sh
          scripts/test-macos-app-resources-check.sh
          bash -n packaging/scripts/preinstall packaging/scripts/postinstall
          python3 -m py_compile sidecar/sidecar.py
      - name: Simulator run guard tests
        if: needs.gate.outputs.full == 'true' || needs.gate.result != 'success'
        run: scripts/test-ios-simulator.sh
      - name: Report host load
        if: always() && runner.environment == 'self-hosted'
        run: scripts/ci-host-load.sh report
      - name: Clean up self-hosted job
        if: always() && runner.environment == 'self-hosted'
        run: scripts/ci-self-hosted.sh cleanup

  verify-linux-rest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            claude-host/package-lock.json
            browser-host/package-lock.json
      - uses: actions/cache@v5
        with:
          path: ~/.cache/agenthail-build/playwright
          key: agenthail-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-host/package-lock.json') }}
      - name: Node host modules
        run: |
          npm ci --prefix claude-host --omit=optional --ignore-scripts --no-audit --no-fund
          npm ci --prefix browser-host --omit=optional --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.cache/agenthail-build/node-v*.tar.gz
          key: agenthail-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-node.sh') }}
      - name: Stage the shipped Node
        run: scripts/fetch-node.sh
      - name: Shipped Node download test
        run: scripts/test-fetch-node.sh
      - name: Release proof tests
        run: |
          scripts/test-release-ios-proof.sh
          scripts/test-release-source-proof.sh
      - name: Format
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go' ':(exclude)**/testdata/**'))
          if [ -n "$unformatted" ]; then echo "run gofmt -w from the toolchain go.mod pins, $(go env GOVERSION) (see docs/maintainers/self-hosted-ci.md), on:"; echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...

      - name: Race tests
        # No workflow race-instruments sqlite's generated C; plain go test -race does.
        run: AGENTHAIL_BROWSER_TEST_BROWSERS="$HOME/.cache/agenthail-build/playwright" go test $(go list ./... | grep -vxE 'github.com/zm2231/agenthail/internal/(daemon|surface/surfaces)') -race -gcflags='modernc.org/...=-d=checkptr=0 -race=false' -count=1 -timeout 25m

  verify-linux-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            claude-host/package-lock.json
            browser-host/package-lock.json
      - uses: actions/cache@v5
        with:
          path: ~/.cache/agenthail-build/playwright
          key: agenthail-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-host/package-lock.json') }}
      - name: Node host tests
        run: |
          npm ci --prefix claude-host --omit=optional --ignore-scripts --no-audit --no-fund
          npm test --prefix claude-host
          npm ci --prefix browser-host --omit=optional --ignore-scripts --no-audit --no-fund
          AGENTHAIL_BROWSER_TEST_BROWSERS="$HOME/.cache/agenthail-build/playwright" npm test --prefix browser-host
      - uses: actions/cache@v5
        with:
          path: ~/.cache/agenthail-build/node-v*.tar.gz
          key: agenthail-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-node.sh') }}
      - name: Stage the shipped Node
        run: scripts/fetch-node.sh
      - name: Race tests of internal/surface/surfaces
        # No workflow race-instruments sqlite's generated C; plain go test -race does.
        run: AGENTHAIL_BROWSER_TEST_BROWSERS="$HOME/.cache/agenthail-build/playwright" go test ./internal/surface/surfaces -race -gcflags='modernc.org/...=-d=checkptr=0 -race=false' -count=1 -timeout 25m

  verify-linux-daemon:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            claude-host/package-lock.json
            browser-host/package-lock.json
      - uses: actions/cache@v5
        with:
          path: ~/.cache/agenthail-build/playwright
          key: agenthail-playwright-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('browser-host/package-lock.json') }}
      - name: Node host modules
        run: |
          npm ci --prefix claude-host --omit=optional --ignore-scripts --no-audit --no-fund
          npm ci --prefix browser-host --omit=optional --ignore-scripts --no-audit --no-fund
      - uses: actions/cache@v5
        with:
          path: ~/.cache/agenthail-build/node-v*.tar.gz
          key: agenthail-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-node.sh') }}
      - name: Stage the shipped Node
        run: scripts/fetch-node.sh
      - name: Race tests, one shard of internal/daemon
        # No workflow race-instruments sqlite's generated C; plain go test -race does.
        run: |
          pattern="$(go run ./scripts/go-test-shard -seconds scripts/go-test-shard/seconds/internal-daemon.tsv ${{ matrix.shard }} ${{ strategy.job-total }} ./internal/daemon -race)"
          AGENTHAIL_BROWSER_TEST_BROWSERS="$HOME/.cache/agenthail-build/playwright" go test ./internal/daemon -race -gcflags='modernc.org/...=-d=checkptr=0 -race=false' -count=1 -timeout 25m -run "$pattern"
      - name: The shards together hold every internal/daemon test go test lists
        if: matrix.shard == 0
        run: |
          AGENTHAIL_BROWSER_TEST_BROWSERS="$HOME/.cache/agenthail-build/playwright" go test ./internal/daemon -race -gcflags='modernc.org/...=-d=checkptr=0 -race=false' -list '.*' | grep -E '^(Test|Example|Fuzz)' | sort > "$RUNNER_TEMP/listed"
          for shard in $(seq 0 $((${{ strategy.job-total }} - 1))); do
            go run ./scripts/go-test-shard -names -seconds scripts/go-test-shard/seconds/internal-daemon.tsv "$shard" ${{ strategy.job-total }} ./internal/daemon -race
          done | sort > "$RUNNER_TEMP/sharded"
          diff "$RUNNER_TEMP/listed" "$RUNNER_TEMP/sharded"

  verify-linux:
    needs: [verify-linux-rest, verify-linux-surfaces, verify-linux-daemon]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Every Linux verify job passed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: scripts/ci-needs-passed.sh "$RESULTS"

  linux-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            claude-host/package-lock.json
            browser-host/package-lock.json
      - uses: actions/cache@v5
        with:
          path: ~/.cache/agenthail-build/node-v*.tar.gz
          key: agenthail-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-node.sh') }}
      - name: Build Linux archives
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch AGENTHAIL_VERSION=v0.0.0-ci scripts/package-release.sh
          done
          (cd dist && sha256sum -c agenthail-v0.0.0-ci-linux-amd64.tar.gz.sha256 agenthail-v0.0.0-ci-linux-arm64.tar.gz.sha256)
          mkdir -p "$RUNNER_TEMP/inspect"
          tar -xzf dist/agenthail-v0.0.0-ci-linux-amd64.tar.gz -C "$RUNNER_TEMP/inspect"
          tar -xzf dist/agenthail-v0.0.0-ci-linux-arm64.tar.gz -C "$RUNNER_TEMP/inspect"
          root="$RUNNER_TEMP/inspect/agenthail-v0.0.0-ci-linux-amd64"
          test "$("$root/runtime/node/bin/node" --version)" = v22.23.1
          "$root/runtime/node/bin/node" scripts/test-staged-hosts.mjs "$root"
          node scripts/test-staged-hosts.mjs "$RUNNER_TEMP/inspect/agenthail-v0.0.0-ci-linux-arm64" --files-only
      - uses: actions/upload-artifact@v7
        with:
          name: agenthail-linux-archives
          path: |
            dist/agenthail-v0.0.0-ci-linux-*.tar.gz
            dist/agenthail-v0.0.0-ci-linux-*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  installer:
    needs: gate
    if: ${{ needs.gate.outputs.full == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-latest' || fromJSON('["self-hosted","macOS","ARM64","agenthail-vm"]') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - uses: actions/cache@v5
        with:
          path: ~/Library/Caches/agenthail-build/node-v*.tar.gz
          key: agenthail-node-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-node.sh') }}
          restore-keys: agenthail-node-${{ runner.os }}-${{ runner.arch }}-
      - name: Shipped Node download test
        run: PATH="$(dirname "$(command -v node)"):/opt/homebrew/bin:/usr/bin:/bin" scripts/test-fetch-node.sh
      - name: Install and upgrade test
        run: |
          scripts/test-pkg-component-plist.sh
          scripts/test-install-upgrade.sh

  package:
    needs: gate
    if: ${{ needs.gate.outputs.full == 'true' }}
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'macos-26' || fromJSON('["self-hosted","macOS","ARM64","agenthail-vm"]') }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/agenthail-build/node-v*.tar.gz
            ~/Library/Caches/agenthail-build/cpython-*.tar.gz
          key: agenthail-runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-node.sh', 'scripts/build-runtime-bundle.sh') }}
          restore-keys: agenthail-runtime-${{ runner.os }}-${{ runner.arch }}-
      - name: Build package
        env:
          AGENTHAIL_ALLOW_UNNOTARIZED: "1"
          AGENTHAIL_INSTALLER_TEAM_ID: AAAAAAAAAA
          AGENTHAIL_UPDATE_RELEASE_URL: https://api.github.com/repos/${{ github.repository }}/releases/latest
          AGENTHAIL_VERSION: v0.0.0-ci
        run: scripts/build-pkg.sh
      - name: Verify package artifact
        env:
          AGENTHAIL_ALLOW_UNNOTARIZED: "1"
        run: scripts/test-pkg-artifact.sh dist/Agenthail-v0.0.0-ci-arm64.pkg
      - uses: actions/upload-artifact@v7
        with:
          name: agenthail-pkg
          path: dist/Agenthail-v0.0.0-ci-arm64.pkg
          if-no-files-found: error
          retention-days: 3
      - name: Verify main window layout at narrow widths
        run: |
          pkgutil --expand-full dist/Agenthail-v0.0.0-ci-arm64.pkg "$RUNNER_TEMP/layout-pkg"
          scripts/test-mac-window-layout.sh "$RUNNER_TEMP/layout-pkg/Agenthail-component.pkg/Payload/Applications/Agenthail.app"
      - name: Verify install, upgrade, and uninstall
        run: scripts/test-pkg-install.sh dist/Agenthail-v0.0.0-ci-arm64.pkg
