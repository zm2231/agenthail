name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: push-relay/package-lock.json
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Session journal browser tests
        run: |
          node scripts/test-session-journal.mjs
          node scripts/test-dashboard-idempotency.mjs
          node scripts/test-dashboard-timeline.mjs
      - name: Public copy check
        run: scripts/check-public-copy.sh
      - name: Race tests
        run: go test ./... -race -count=1
      - name: Push relay tests
        working-directory: push-relay
        run: |
          npm ci --ignore-scripts
          npm test
          npm run deploy:dry-run
      - name: Verify configurable release build
        run: |
          binary="$RUNNER_TEMP/agenthail-relay-config"
          relay="https://push.example.test"
          release_api="https://api.github.com/repos/example/agenthail/releases/latest"
          team="AAAAAAAAAA"
          go build -trimpath -ldflags "-X github.com/zm2231/agenthail/internal/daemon.bundledPushRelayURL=$relay -X github.com/zm2231/agenthail/internal/cli.latestReleaseURL=$release_api -X github.com/zm2231/agenthail/internal/cli.expectedInstallerTeamID=$team" -o "$binary" ./cmd/agenthail
          strings "$binary" | grep -F "$relay" >/dev/null
          strings "$binary" | grep -F "$release_api" >/dev/null
          strings "$binary" | grep -F "$team" >/dev/null
      - name: Verify generated iOS project
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          scripts/test-xcodegen-project.sh
      - name: iOS release device build
        run: xcodebuild build -project native/Agenthail.xcodeproj -scheme AgenthailIOS -configuration Release -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO
      - name: iOS simulator tests
        run: |
          derived="$RUNNER_TEMP/ios-derived"
          runtime="$(xcrun simctl list runtimes --json | jq -r '.runtimes | map(select(.isAvailable and (.identifier | contains("iOS")))) | last | .identifier')"
          device="$(xcrun simctl list devicetypes --json | jq -r '.devicetypes | map(select(.name | startswith("iPhone"))) | first | .identifier')"
          udid="$(xcrun simctl create Agenthail-CI "$device" "$runtime")"
          trap 'xcrun simctl delete "$udid"' EXIT
          xcodebuild test -project native/Agenthail.xcodeproj -scheme AgenthailIOS -configuration Debug -destination "platform=iOS Simulator,id=$udid" -derivedDataPath "$derived" -parallel-testing-enabled NO
          plist="$derived/Build/Products/Debug-iphonesimulator/Agenthail.app/Info.plist"
          test "$(plutil -extract NSCameraUsageDescription raw -o - "$plist")" = "Scan the pairing code shown by Agenthail on your Mac."
          test "$(plutil -extract UIBackgroundModes.0 raw -o - "$plist")" = "remote-notification"
      - name: Native helper tests
        run: |
          swiftc -parse-as-library native/DuplicateApplicationPolicy.swift native/tests/duplicate_application_policy_test.swift -o "$RUNNER_TEMP/duplicate-application-policy-test"
          "$RUNNER_TEMP/duplicate-application-policy-test"
          swiftc -parse-as-library native/SessionSelection.swift native/tests/session_selection_test.swift -o "$RUNNER_TEMP/session-selection-test"
          "$RUNNER_TEMP/session-selection-test"
          swiftc -parse-as-library native/EventRetryBackoff.swift native/tests/event_retry_backoff_test.swift -o "$RUNNER_TEMP/event-retry-backoff-test"
          "$RUNNER_TEMP/event-retry-backoff-test"
          swiftc -parse-as-library native/OperationsRefreshPolicy.swift native/tests/operations_refresh_policy_test.swift -o "$RUNNER_TEMP/operations-refresh-policy-test"
          "$RUNNER_TEMP/operations-refresh-policy-test"
          swiftc -parse-as-library native/StatusRefreshPolicy.swift native/tests/status_refresh_policy_test.swift -o "$RUNNER_TEMP/status-refresh-policy-test"
          "$RUNNER_TEMP/status-refresh-policy-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/tests/dashboard_snapshot_test.swift -o "$RUNNER_TEMP/dashboard-snapshot-test"
          "$RUNNER_TEMP/dashboard-snapshot-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/macOS/SessionTree.swift native/tests/session_tree_test.swift -o "$RUNNER_TEMP/session-tree-test"
          "$RUNNER_TEMP/session-tree-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/macOS/SessionTree.swift native/macOS/LocalSend.swift native/tests/local_send_test.swift -o "$RUNNER_TEMP/local-send-test"
          "$RUNNER_TEMP/local-send-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/macOS/CatalogPosition.swift native/tests/catalog_position_test.swift -o "$RUNNER_TEMP/catalog-position-test"
          "$RUNNER_TEMP/catalog-position-test"
          swiftc -parse-as-library native/macOS/PeerEnvelope.swift native/tests/peer_envelope_test.swift -o "$RUNNER_TEMP/peer-envelope-test"
          "$RUNNER_TEMP/peer-envelope-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/macOS/ToolRunSummary.swift native/tests/tool_run_summary_test.swift -o "$RUNNER_TEMP/tool-run-summary-test"
          "$RUNNER_TEMP/tool-run-summary-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/macOS/TranscriptBlock.swift native/tests/transcript_block_test.swift -o "$RUNNER_TEMP/transcript-block-test"
          "$RUNNER_TEMP/transcript-block-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/AgenthailAPI.swift native/AgenthailModel.swift native/TurnSettings.swift native/EventRetryBackoff.swift native/SessionSelection.swift native/OperationsRefreshPolicy.swift native/StatusRefreshPolicy.swift native/macOS/SessionPane.swift native/macOS/CatalogPosition.swift native/macOS/LocalSend.swift native/macOS/SessionTree.swift native/macOS/AgenthailProcess.swift native/macOS/AgenthailLink.swift native/macOS/MetadataOverlay.swift native/macOS/SessionLaunch.swift native/tests/session_pane_test.swift -o "$RUNNER_TEMP/session-pane-test"
          "$RUNNER_TEMP/session-pane-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/macOS/AgenthailLink.swift native/tests/agenthail_link_test.swift -o "$RUNNER_TEMP/agenthail-link-test"
          "$RUNNER_TEMP/agenthail-link-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/macOS/MetadataOverlay.swift native/tests/metadata_overlay_test.swift -o "$RUNNER_TEMP/metadata-overlay-test"
          "$RUNNER_TEMP/metadata-overlay-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/macOS/ContextBreakdown.swift native/tests/context_breakdown_test.swift -o "$RUNNER_TEMP/context-breakdown-test"
          "$RUNNER_TEMP/context-breakdown-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/macOS/SessionLaunch.swift native/tests/session_launch_test.swift -o "$RUNNER_TEMP/session-launch-test"
          "$RUNNER_TEMP/session-launch-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/tests/goal_editor_state_test.swift -o "$RUNNER_TEMP/goal-editor-state-test"
          "$RUNNER_TEMP/goal-editor-state-test"
          swiftc -parse-as-library native/AgenthailModels.swift native/macOS/SpotlightIndex.swift native/tests/spotlight_index_test.swift -o "$RUNNER_TEMP/spotlight-index-test"
          "$RUNNER_TEMP/spotlight-index-test"
          swiftc -parse-as-library native/macOS/ComposerDrop.swift native/tests/composer_drop_test.swift -o "$RUNNER_TEMP/composer-drop-test"
          "$RUNNER_TEMP/composer-drop-test"
          swiftc -parse-as-library native/macOS/SessionHandle.swift native/tests/session_handle_test.swift -o "$RUNNER_TEMP/session-handle-test"
          "$RUNNER_TEMP/session-handle-test"
      - name: Mac app build
        run: swift build --package-path native -c release --product AgenthailMac
      - name: Installer lint
        run: |
          find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -n1 bash -n
          scripts/test-codesign-retry.sh
          bash -n packaging/scripts/preinstall packaging/scripts/postinstall
          python3 -m py_compile sidecar/sidecar.py

  installer:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sidecar/package-lock.json
      - name: Install and upgrade test
        run: |
          scripts/test-pkg-component-plist.sh
          scripts/test-install-upgrade.sh

  package:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build package
        env:
          AGENTHAIL_ALLOW_UNNOTARIZED: "1"
          AGENTHAIL_INSTALLER_TEAM_ID: AAAAAAAAAA
          AGENTHAIL_UPDATE_RELEASE_URL: https://api.github.com/repos/${{ github.repository }}/releases/latest
          AGENTHAIL_VERSION: v0.0.0-ci
        run: scripts/build-pkg.sh
      - name: Verify package artifact
        env:
          AGENTHAIL_ALLOW_UNNOTARIZED: "1"
        run: scripts/test-pkg-artifact.sh dist/Agenthail-v0.0.0-ci-arm64.pkg
      - name: Verify install, upgrade, and uninstall
        run: scripts/test-pkg-install.sh dist/Agenthail-v0.0.0-ci-arm64.pkg
