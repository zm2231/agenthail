name: Mac build cache

# A tag's run restores only caches saved on the default branch, so the release
# reads the Mac app's Swift build that main saves here.
on:
  push:
    branches: [main]
    paths:
      - native/Package.resolved
      - native/Package.swift
      - native/Packages/**
      - scripts/build-mac-swift.sh
      - scripts/mac-swift-cache-key.sh
      - .github/workflows/mac-build-cache.yml
  pull_request:
    paths:
      - native/Package.resolved
      - native/Package.swift
      - native/Packages/**
      - scripts/build-mac-swift.sh
      - scripts/mac-swift-cache-key.sh
      - .github/workflows/mac-build-cache.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-build-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-release-build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - id: key
        run: echo "key=$(scripts/mac-swift-cache-key.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        with:
          path: native/.build
          key: ${{ steps.key.outputs.key }}
      - name: Probe a build from the restored cache
        run: |
          set -x
          du -sh native/.build; ls native/.build
          find native/.build -maxdepth 3 -type d | head -50
          touch "$RUNNER_TEMP/marker"; sleep 1
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          B=(swift build --package-path native -c release --build-system swiftbuild --triple arm64-apple-macosx15.0 -Xlinker -platform_version -Xlinker macos -Xlinker 15.0 -Xlinker "$SDK_VERSION")
          start=$(date +%s); "${B[@]}" --product AgenthailMac -v > "$RUNNER_TEMP/warm1.log" 2>&1 || true; echo "FIRST BUILD AFTER RESTORE: $(( $(date +%s) - start )) s"
          grep -cE 'swift-frontend|swiftc ' "$RUNNER_TEMP/warm1.log" || true
          grep -oE '\-module-name [A-Za-z0-9_]+' "$RUNNER_TEMP/warm1.log" | sort | uniq -c | sort -rn | head -40
          grep -iE 'invalidat|out of date|changed|because|rebuild|stale' "$RUNNER_TEMP/warm1.log" | head -40
          head -60 "$RUNNER_TEMP/warm1.log"
          echo "WRITTEN OUTSIDE native/.build:"
          for d in "$HOME/Library/Caches" "$HOME/Library/Developer" "$HOME/.swiftpm" "$HOME/Library/org.swift.swiftpm" "${TMPDIR:-/tmp}"; do [ -d "$d" ] && find "$d" -newer "$RUNNER_TEMP/marker" -maxdepth 4 -type d 2>/dev/null | head -20 && du -sh "$d" 2>/dev/null; done
          start=$(date +%s); "${B[@]}" --product AgenthailMac > "$RUNNER_TEMP/warm2.log" 2>&1 || true; echo "SECOND BUILD, NOTHING CHANGED: $(( $(date +%s) - start )) s"
          tail -5 "$RUNNER_TEMP/warm2.log"
          find native -newer "$RUNNER_TEMP/marker" -path '*/.build/*' -maxdepth 6 -type d | head -30
