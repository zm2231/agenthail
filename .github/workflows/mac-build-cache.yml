name: Mac build cache

# A tag's run restores only caches saved on the default branch, so the release
# reads the Mac app's Swift build that main saves here.
on:
  push:
    branches: [main]
    paths:
      - native/Package.resolved
      - native/Package.swift
      - native/Packages/**
      - scripts/build-mac-swift.sh
      - scripts/mac-swift-cache-key.sh
      - .github/workflows/mac-build-cache.yml
  pull_request:
    paths:
      - native/Package.resolved
      - native/Package.swift
      - native/Packages/**
      - scripts/build-mac-swift.sh
      - scripts/mac-swift-cache-key.sh
      - .github/workflows/mac-build-cache.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mac-build-cache-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift-release-build:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Probe source mtimes from git
        run: |
          restore_mtime() {
            git log --format='T %ct' --name-only -- native | awk '/^T / {t=$2; next} NF && !($0 in seen) {seen[$0]=1; print t "\t" $0}' |
              while IFS="$(printf '\t')" read -r t f; do [ -f "$f" ] && touch -t "$(date -r "$t" +%Y%m%d%H%M.%S)" "$f"; done
          }
          SDK_VERSION="$(xcrun --sdk macosx --show-sdk-version)"
          B=(swift build --package-path native -c release --build-system swiftbuild --triple arm64-apple-macosx15.0 -Xlinker -platform_version -Xlinker macos -Xlinker 15.0 -Xlinker "$SDK_VERSION" --product AgenthailMac)
          start=$(date +%s); restore_mtime; echo "RESTORE MTIME: $(( $(date +%s) - start )) s"
          start=$(date +%s); "${B[@]}" > "$RUNNER_TEMP/cold.log" 2>&1; echo "COLD BUILD: $(( $(date +%s) - start )) s"
          git ls-files native | xargs rm -f; git checkout -- native
          start=$(date +%s); "${B[@]}" -v > "$RUNNER_TEMP/fresh.log" 2>&1; echo "FRESH CHECKOUT, NO MTIME RESTORE: $(( $(date +%s) - start )) s"
          grep -oE '\-module-name [A-Za-z0-9_]+' "$RUNNER_TEMP/fresh.log" | sort | uniq -c
          git ls-files native | xargs rm -f; git checkout -- native; restore_mtime
          start=$(date +%s); "${B[@]}" -v > "$RUNNER_TEMP/restored.log" 2>&1; echo "FRESH CHECKOUT, MTIME RESTORED: $(( $(date +%s) - start )) s"
          grep -oE '\-module-name [A-Za-z0-9_]+' "$RUNNER_TEMP/restored.log" | sort | uniq -c
          f="$(git ls-files 'native/macOS/*.swift' | head -1)"; echo "// probe" >> "$f"
          start=$(date +%s); "${B[@]}" -v > "$RUNNER_TEMP/app.log" 2>&1; echo "ONE APP FILE CHANGED: $(( $(date +%s) - start )) s"
          grep -oE '\-module-name [A-Za-z0-9_]+' "$RUNNER_TEMP/app.log" | sort | uniq -c
          git checkout -- "$f"
          f="$(git ls-files 'native/Packages/Textual/Sources/*.swift' | head -1)"; echo "// probe" >> "$f"
          start=$(date +%s); "${B[@]}" > "$RUNNER_TEMP/textual.log" 2>&1; echo "ONE TEXTUAL FILE CHANGED: $(( $(date +%s) - start )) s"
