name: Agenthail
options:
  bundleIdPrefix: com.agenthail
  deploymentTarget:
    iOS: "18.0"
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 154.0.0
  Textual:
    url: https://github.com/gonzalezreal/textual
    exactVersion: 0.5.0
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.5"
    CURRENT_PROJECT_VERSION: "1"
    AGENTHAIL_IOS_BUNDLE_ID: com.agenthail.ios
    AGENTHAIL_KEYCHAIN_GROUP: $(AppIdentifierPrefix)$(AGENTHAIL_IOS_BUNDLE_ID).shared
targets:
  AgenthailIOS:
    type: application
    platform: iOS
    dependencies:
      - package: WebRTC
      - package: Textual
      - target: AgenthailIOSNotificationService
    sources:
      - path: AgenthailModels.swift
      - path: TurnSettings.swift
      - path: AgenthailAPI.swift
      - path: HolderPins.swift
      - path: ComposerAttachment.swift
      - path: SessionSelection.swift
      - path: SessionTree.swift
      - path: EventRetryBackoff.swift
      - path: ToolPresentation.swift
      - path: VoiceAPI.swift
      - path: VoiceAudioBridge.swift
      - path: VoiceCallDiagnostics.swift
      - path: VoiceOperatorModel.swift
      - path: RequestNotifications.swift
      - path: RequestAnswer.swift
      - path: RequestCard.swift
      - path: PairedCredential.swift
      - path: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AGENTHAIL_IOS_BUNDLE_ID)
        PRODUCT_NAME: Agenthail
        INFOPLIST_KEY_CFBundleDisplayName: Agenthail
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: iOS/AgenthailIOS.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Debug:
          AGENTHAIL_APNS_ENVIRONMENT: sandbox
          APNS_ENVIRONMENT: development
          APP_ATTEST_ENVIRONMENT: development
        Release:
          AGENTHAIL_APNS_ENVIRONMENT: production
          APNS_ENVIRONMENT: production
          APP_ATTEST_ENVIRONMENT: production
    info:
      path: iOS/Info.plist
      properties:
        ITSAppUsesNonExemptEncryption: false
        AgenthailAPNSEnvironment: $(AGENTHAIL_APNS_ENVIRONMENT)
        AgenthailKeychainGroup: $(AGENTHAIL_KEYCHAIN_GROUP)
        NSCameraUsageDescription: Scan the pairing code shown by Agenthail on your computer, or take a photo to send to an agent.
        NSMicrophoneUsageDescription: Talk directly to your Codex Voice orchestrator. Audio is sent to Codex, not transcribed on this device.
        UIBackgroundModes:
          - remote-notification
          - audio
          - voip
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.agenthail.pairing
            CFBundleURLSchemes:
              - agenthail
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  AgenthailIOSNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: RequestNotifications.swift
      - path: PairedCredential.swift
      - path: iOSNotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(AGENTHAIL_IOS_BUNDLE_ID).NotificationService
        PRODUCT_NAME: AgenthailNotificationService
        CODE_SIGN_ENTITLEMENTS: iOSNotificationService/AgenthailNotificationService.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: iOSNotificationService/Info.plist
      properties:
        CFBundleDisplayName: Agenthail
        AgenthailKeychainGroup: $(AGENTHAIL_KEYCHAIN_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  AgenthailIOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iOSTests
    dependencies:
      - target: AgenthailIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agenthail.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Agenthail.app/Agenthail
        BUNDLE_LOADER: $(TEST_HOST)
  AgenthailIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: iOSUITests
    dependencies:
      - target: AgenthailIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.agenthail.ios.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: AgenthailIOS
schemes:
  AgenthailIOS:
    build:
      targets:
        AgenthailIOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AgenthailIOSTests
        - AgenthailIOSUITests
    archive:
      config: Release
